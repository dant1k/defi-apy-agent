<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        .result {
            background: #111;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .error {
            border-color: #f00;
            color: #f00;
        }
        .success {
            border-color: #0f0;
            color: #0f0;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0052a3;
        }
    </style>
</head>
<body>
    <h1>🧠 Genora API Test</h1>
    
    <div>
        <button onclick="testAPI()">Test API Connection</button>
        <button onclick="testStrategies()">Test Strategies Endpoint</button>
        <button onclick="testHealth()">Test Health Endpoint</button>
    </div>
    
    <div id="results"></div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }

        async function testAPI() {
            addResult('Testing API connection...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/health');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ API Health: ${JSON.stringify(data)}`, 'success');
                } else {
                    addResult(`❌ API Health failed: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ API Connection failed: ${error.message}`, 'error');
            }
        }

        async function testStrategies() {
            addResult('Testing strategies endpoint...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/strategies?limit=3');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Strategies loaded: ${data.items?.length || 0} items`, 'success');
                    if (data.items && data.items.length > 0) {
                        const first = data.items[0];
                        addResult(`First strategy: ${first.name} (${first.protocol}) - ${first.apy}% APY`, 'info');
                    }
                } else {
                    addResult(`❌ Strategies failed: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Strategies request failed: ${error.message}`, 'error');
            }
        }

        async function testHealth() {
            addResult('Testing health endpoint...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/health');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Health check: ${JSON.stringify(data)}`, 'success');
                } else {
                    addResult(`❌ Health check failed: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Health check failed: ${error.message}`, 'error');
            }
        }

        // Auto-test on load
        window.onload = function() {
            addResult('Page loaded. Click buttons to test API endpoints.', 'info');
        };
    </script>
</body>
</html>
